name: arabya-mpt

# MoneyPrinterTurbo API beside Next.js. Does not replace /studio ayah editor.
# Usage from repo root:
#   docker compose -f docker-compose.mpt.yml up --build
# Then set MONEYPRINTER_API_URL=http://127.0.0.1:8080 in .env.local

services:
  mpt-api:
    build:
      context: ./services/money-printer-turbo
      dockerfile: Dockerfile
      args:
        DOCKER_BUILD_MIRROR: default
        PIP_USE_OFFICIAL: "1"
    container_name: arabya-mpt-api
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      PEXELS_API_KEYS: ${PEXELS_API_KEYS:-}
      PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
      PIXABAY_API_KEYS: ${PIXABAY_API_KEYS:-}
    command: ["python3", "main.py"]
    volumes:
      - ./services/money-printer-turbo:/MoneyPrinterTurbo
    restart: unless-stopped
