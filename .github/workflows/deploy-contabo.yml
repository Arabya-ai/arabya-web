name: Deploy Contabo

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-contabo
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Validate SSH secrets
        env:
          SSH_HOST: ${{ secrets.CONTABO_HOST }}
          SSH_USER: ${{ secrets.CONTABO_SSH_USER }}
          SSH_KEY: ${{ secrets.CONTABO_SSH_KEY }}
          SSH_KEY_B64: ${{ secrets.CONTABO_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ]; then
            echo "::error::Missing CONTABO_HOST or CONTABO_SSH_USER in Production secrets."
            exit 1
          fi
          if [ -n "$SSH_KEY_B64" ]; then
            echo "Will use CONTABO_SSH_KEY_B64"
            exit 0
          fi
          if [ -z "$SSH_KEY" ]; then
            echo "::error::Set CONTABO_SSH_KEY (PEM) or CONTABO_SSH_KEY_B64 in Production secrets."
            exit 1
          fi
          if ! printf '%s' "$SSH_KEY" | grep -q 'BEGIN.*PRIVATE KEY'; then
            echo "::error::CONTABO_SSH_KEY must be the PRIVATE key file (starts with -----BEGIN ... PRIVATE KEY-----)."
            echo "Do not paste the .pub public key."
            exit 1
          fi

      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.CONTABO_HOST }}
          SSH_USER: ${{ secrets.CONTABO_SSH_USER }}
          SSH_KEY: ${{ secrets.CONTABO_SSH_KEY }}
          SSH_KEY_B64: ${{ secrets.CONTABO_SSH_KEY_B64 }}
          MPT_DAHL_API_KEY: ${{ secrets.MPT_DAHL_API_KEY }}
          MPT_DAHL_API_KEYS: ${{ secrets.MPT_DAHL_API_KEYS }}
          MPT_DAHL_MODELS: ${{ secrets.MPT_DAHL_MODELS }}
          MONEYPRINTER_API_URL: ${{ secrets.MONEYPRINTER_API_URL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PEXELS_API_KEYS: ${{ secrets.PEXELS_API_KEYS }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PIXABAY_API_KEYS: ${{ secrets.PIXABAY_API_KEYS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$SSH_KEY_B64" ]; then
            printf '%s' "$SSH_KEY_B64" | tr -d '\n' | base64 -d > ~/.ssh/contabo_key
          else
            printf '%s\n' "$SSH_KEY" > ~/.ssh/contabo_key
          fi
          chmod 600 ~/.ssh/contabo_key
          if ! ssh-keygen -lf ~/.ssh/contabo_key >/dev/null 2>&1; then
            echo "::error::Could not parse SSH private key. Delete CONTABO_SSH_KEY and paste the full private key again, or use CONTABO_SSH_KEY_B64."
            exit 1
          fi
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          REMOTE_ENV=""
          if [ -n "${MPT_DAHL_API_KEY:-}" ]; then
            REMOTE_ENV="${REMOTE_ENV} export MPT_DAHL_API_KEY=$(printf %q "$MPT_DAHL_API_KEY");"
          fi
          if [ -n "${MPT_DAHL_API_KEYS:-}" ]; then
            REMOTE_ENV="${REMOTE_ENV} export MPT_DAHL_API_KEYS=$(printf %q "$MPT_DAHL_API_KEYS");"
          fi
          if [ -n "${MPT_DAHL_MODELS:-}" ]; then
            REMOTE_ENV="${REMOTE_ENV} export MPT_DAHL_MODELS=$(printf %q "$MPT_DAHL_MODELS");"
          fi
          if [ -n "${MONEYPRINTER_API_URL:-}" ]; then
            REMOTE_ENV="${REMOTE_ENV} export MONEYPRINTER_API_URL=$(printf %q "$MONEYPRINTER_API_URL");"
          fi
          if [ -n "${PEXELS_API_KEY:-}" ]; then
            REMOTE_ENV="${REMOTE_ENV} export PEXELS_API_KEY=$(printf %q "$PEXELS_API_KEY");"
          fi
          if [ -n "${PEXELS_API_KEYS:-}" ]; then
            REMOTE_ENV="${REMOTE_ENV} export PEXELS_API_KEYS=$(printf %q "$PEXELS_API_KEYS");"
          fi
          if [ -n "${PIXABAY_API_KEY:-}" ]; then
            REMOTE_ENV="${REMOTE_ENV} export PIXABAY_API_KEY=$(printf %q "$PIXABAY_API_KEY");"
          fi
          if [ -n "${PIXABAY_API_KEYS:-}" ]; then
            REMOTE_ENV="${REMOTE_ENV} export PIXABAY_API_KEYS=$(printf %q "$PIXABAY_API_KEYS");"
          fi
          ssh -i ~/.ssh/contabo_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" \
            "${REMOTE_ENV} cd /var/www/arabya-web && bash scripts/contabo-deploy.sh"
          rm -f ~/.ssh/contabo_key
