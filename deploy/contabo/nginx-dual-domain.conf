# Nginx — dual domain on Contabo (www.arabya.org + www.arabyaai.com)
#
# Copy to /etc/nginx/sites-available/arabya-web and symlink sites-enabled.
# Replace SSL paths after certbot. Both domains proxy to the same Next.js app.

upstream arabya_next {
  server 127.0.0.1:3000;
  keepalive 32;
}

# Apex → www (per domain)
server {
  listen 80;
  listen [::]:80;
  server_name arabya.org arabyaai.com;
  return 308 https://www.$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name arabya.org arabyaai.com;
  ssl_certificate     /etc/letsencrypt/live/www.arabya.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/www.arabya.org/privkey.pem;
  return 308 https://www.$host$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  server_name www.arabya.org www.arabyaai.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.arabya.org www.arabyaai.com;

  ssl_certificate     /etc/letsencrypt/live/www.arabya.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/www.arabya.org/privkey.pem;
  # certbot --nginx -d www.arabya.org -d arabya.org -d www.arabyaai.com -d arabyaai.com

  client_max_body_size 32m;

  # Lughawi proofread can wait on Contabo NLP; avoid premature 504 HTML
  # (browser then shows «تعذّر إكمال الطلب» when JSON parse fails).
  location /api/lughawi/ {
    proxy_pass http://arabya_next;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 90s;
    proxy_read_timeout 90s;
  }

  location / {
    proxy_pass http://arabya_next;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
  }
}
